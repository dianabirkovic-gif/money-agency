<style>
  :root {
    --bg: #0c0c0c; --surface: #141414; --surface2: #1c1c1c;
    --gold: #c9a84c; --gold2: #e8c97a; --gold-dim: rgba(201,168,76,0.12);
    --border: rgba(201,168,76,0.15); --border2: rgba(255,255,255,0.06);
    --text: #f0ece3; --muted: #6b6560; --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* LOGIN */
  #loginScreen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
  .login-box { width: 380px; max-width: 100%; border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; background: var(--surface); }
  .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; color: var(--gold); text-align: center; margin-bottom: 6px; }
  .login-sub { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 32px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
  .login-field input, .login-field select { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 10px; padding: 13px 14px; font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s; }
  .login-field input:focus, .login-field select:focus { border-color: var(--gold); }
  .login-field select option { background: #1c1c1c; }
  .login-btn { width: 100%; padding: 14px; background: var(--gold); border: none; color: #0c0c0c; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .login-error { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; display: none; }

  /* HEADER */
  header { position: sticky; top: 0; z-index: 50; height: 56px; background: rgba(12,12,12,0.97); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .user-chip { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .user-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .btn-primary { background: var(--gold); color: #0c0c0c; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; }
  .btn-logout { background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; }

  /* TEAM BAR */
  .team-bar { background: var(--surface); border-bottom: 1px solid var(--border2); padding: 8px 16px; display: flex; align-items: center; gap: 10px; overflow-x: auto; flex-wrap: nowrap; }
  .team-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; flex-shrink: 0; }
  .team-member { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a09890; flex-shrink: 0; }
  .cavatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; flex-shrink: 0; }

  /* TOOLBAR */
  .toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border2); background: var(--surface); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .filter-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
  .ftab { padding: 6px 12px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif; flex-shrink: 0; }
  .ftab.active { background: var(--gold-dim); border-color: var(--border); color: var(--gold); }
  .sync-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

  /* STATS */
  .stats { padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border2); }
  .stat { display: flex; align-items: center; gap: 6px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 5px 10px; }
  .stat .sd { width: 6px; height: 6px; border-radius: 50%; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat strong { font-size: 12px; font-weight: 700; }

  /* BOARD */
  .board-wrap { padding: 12px 16px; }
  .board { display: flex; flex-direction: column; gap: 10px; }
  .col { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; overflow: hidden; }
  .col-head { padding: 12px 14px; border-bottom: 1px solid var(--border2); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .col-title { display: flex; align-items: center; gap: 8px; }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; }
  .col-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
  .col-right { display: flex; align-items: center; gap: 8px; }
  .col-count { background: var(--surface2); color: var(--muted); padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .col-toggle { color: var(--muted); font-size: 14px; transition: transform 0.2s; }
  .col-toggle.collapsed { transform: rotate(-90deg); }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col-body.hidden { display: none; }
  .col-add-btn { margin: 0 10px 10px; padding: 12px; background: transparent; border: 1px dashed rgba(201,168,76,0.2); color: var(--muted); cursor: pointer; border-radius: 9px; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; width: calc(100% - 20px); }

  /* CARD */
  .card { background: #181818; border: 1px solid var(--border2); border-radius: 12px; padding: 13px; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .ctag { padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .cpriority { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
  .p-urgent { background: #e05252; }
  .p-high { background: #e09352; }
  .p-normal { background: var(--gold); }
  .p-low { background: #52b788; }
  .card-title { font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--text); margin-bottom: 10px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-assignee { display: flex; align-items: center; gap: 6px; }
  .aname { font-size: 11px; color: var(--muted); }
  .card-due { font-size: 10px; font-weight: 600; }

  /* CARD ACTIONS — always visible on mobile */
  .card-actions { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border2); }
  .cact { flex: 1; background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); cursor: pointer; border-radius: 8px; padding: 9px; font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 600; text-align: center; }
  .cact.del { background: rgba(224,82,82,0.08); border-color: rgba(224,82,82,0.2); color: var(--danger); }

  /* MOVE BUTTONS */
  .card-move { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .cmove { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); cursor: pointer; border-radius: 6px; padding: 5px 8px; font-size: 10px; font-family: 'DM Sans', sans-serif; font-weight: 600; }
  .cmove:active { background: var(--gold-dim); color: var(--gold); border-color: var(--border); }

  /* MODAL */
  .modal-bg { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); align-items: flex-end; justify-content: center; padding: 0; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--gold); margin-bottom: 18px; }
  .mfield { margin-bottom: 14px; }
  .mfield label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .mfield input, .mfield select, .mfield textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 10px; padding: 12px 13px; font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; }
  .mfield input:focus, .mfield select:focus, .mfield textarea:focus { border-color: var(--gold); }
  .mfield select option { background: #1c1c1c; }
  .mfield textarea { resize: none; height: 80px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .mbtn-cancel { flex: 1; background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 13px; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; }
  .mbtn-save { flex: 2; background: var(--gold); color: #0c0c0c; border: none; padding: 13px; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--muted); font-size: 14px; gap: 10px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .card { animation: fadeUp 0.2s ease; }
</style>
</head>

<script>
// ── CONFIG ──────────────────────────────────────────────
const EMAILJS_SERVICE = 'service_ut05u37';
const EMAILJS_TEMPLATE = 'template_k3jscmo';

// Email map for team members
const TEAM_EMAILS = {
  owner:  'dianabirkovic@gmail.com',
  proj:   null,
  smm1:   'kristina.bonkaa@gmail.com',
  smm2:   null,
  smm3:   null,
  smm4:   'levenecira1905@gmail.com',
  target: 'livemenik@gmail.com',
};

async function sendEmailNotification(card) {
  const email = TEAM_EMAILS[card.assignee];
  if (!email) return;
  const a = ASSIGNEES[card.assignee];
  const priorityLabels = { urgent: 'Терміново', high: 'Високий', normal: 'Середній', low: 'Низький' };
  const colLabels = { backlog: 'Беклог', todo: 'До виконання', inprogress: 'В роботі', review: 'На погодженні', done: 'Готово' };
  try {
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
      to_email: email,
      assignee_name: a.label,
      task_title: card.title,
      task_col: colLabels[card.col] || card.col,
      task_priority: priorityLabels[card.priority] || card.priority,
      task_due: card.due || 'Не вказано',
    });
    console.log('Email sent to', email);
  } catch(e) {
    console.error('Email error:', e);
  }
}
const PASSWORD = 'money2024';
const DB_URL = 'https://money-agency-board-default-rtdb.firebaseio.com/cards.json';

const COLS = {
  backlog:    { name: 'Беклог',        color: '#6b6560' },
  todo:       { name: 'До виконання',  color: '#60a5fa' },
  inprogress: { name: 'В роботі',      color: '#c9a84c' },
  review:     { name: 'На погодженні', color: '#f472b6' },
  done:       { name: 'Готово',        color: '#34d399' },
};

const ASSIGNEES = {
  owner:  { label: 'Власниця',  short: 'ВЛ', color: '#c9a84c' },
  proj:   { label: 'Аліна',  short: 'АЛ', color: '#60a5fa' },
  smm1:   { label: 'Kristina',    short: 'KR', color: '#a78bfa' },
  smm2:   { label: 'Настя',    short: 'НА', color: '#f472b6' },
  smm3:   { label: 'Лєра',    short: 'ЛЄ', color: '#fb923c' },
  smm4:   { label: 'Іра',    short: 'ІР', color: '#a3e635' },
  target: { label: 'Нікіта',short: 'НК', color: '#34d399' },
};

const TAGS = {
  project: { bg: 'rgba(96,165,250,0.12)',  color: '#93c5fd' },
  smm:     { bg: 'rgba(167,139,250,0.12)', color: '#c4b5fd' },
  target:  { bg: 'rgba(52,211,153,0.12)',  color: '#6ee7b7' },
  content: { bg: 'rgba(201,168,76,0.12)',  color: '#e8c97a' },
  design:  { bg: 'rgba(244,114,182,0.12)', color: '#f9a8d4' },
  client:  { bg: 'rgba(251,146,60,0.12)',  color: '#fdba74' },
};

const COL_NAMES = { backlog:'Беклог', todo:'До виконання', inprogress:'В роботі', review:'На погодженні', done:'Готово' };

// ── STATE ────────────────────────────────────────────────
let cards = [];
let currentUser = null;
let activeFilter = 'all';
let editId = null;
let collapsed = {};
let saveTimer = null;
let syncTimer = null;

// ── SESSION ──────────────────────────────────────────────
function saveSession(role) { try { localStorage.setItem('ma_user', role); } catch(e){} }
function loadSession() { try { return localStorage.getItem('ma_user'); } catch(e){ return null; } }
function clearSession() { try { localStorage.removeItem('ma_user'); } catch(e){} }

// ── AUTH ─────────────────────────────────────────────────
function doLogin() {
  const role = document.getElementById('loginRole').value;
  const pass = document.getElementById('loginPass').value;
  if (!role || pass !== PASSWORD) { document.getElementById('loginErr').style.display = 'block'; return; }
  startApp(role);
}

function startApp(role) {
  currentUser = role;
  saveSession(role);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userLabel').textContent = ASSIGNEES[role]?.label || role;
  loadCards();
  syncTimer = setInterval(loadCards, 30000);
}

function doLogout() {
  clearSession();
  currentUser = null;
  clearInterval(syncTimer);
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPass').value = '';
}

document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// Auto-login from session
window.addEventListener('load', () => {
  const saved = loadSession();
  if (saved && ASSIGNEES[saved]) startApp(saved);
});

// ── FIREBASE DB ──────────────────────────────────────────
async function loadCards() {
  try {
    const res = await fetch(DB_URL);
    const data = await res.json();
    if (data && typeof data === 'object') {
      cards = Object.entries(data).map(([fbId, c]) => ({ ...c, fbId }));
    } else {
      cards = [];
    }
    document.getElementById('syncLabel').textContent = 'Оновлено ' + new Date().toLocaleTimeString('uk', {hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('syncLabel').textContent = 'Офлайн';
  }
  render();
}

async function addCardToDB(card) {
  try {
    const res = await fetch(DB_URL.replace('/cards.json', '/cards.json'), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(card)
    });
    const data = await res.json();
    return data.name;
  } catch(e) { return null; }
}

async function updateCardInDB(fbId, card) {
  try {
    await fetch(DB_URL.replace('.json', `/${fbId}.json`), {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(card)
    });
  } catch(e) {}
}

async function deleteCardFromDB(fbId) {
  try {
    await fetch(DB_URL.replace('.json', `/${fbId}.json`), { method: 'DELETE' });
  } catch(e) {}
}

// ── RENDER ───────────────────────────────────────────────
function visible(col) {
  return cards.filter(c => c.col === col && (activeFilter === 'all' || c.assignee === activeFilter));
}

function dueInfo(due) {
  if (!due) return null;
  const diff = Math.round((new Date(due) - new Date(new Date().toDateString())) / 86400000);
  if (diff < 0)   return { label: '⚠ прострочено', color: '#e05252' };
  if (diff === 0) return { label: '📌 сьогодні',   color: '#c9a84c' };
  if (diff === 1) return { label: '⏰ завтра',      color: '#c9a84c' };
  return { label: `📅 ${due.split('-').reverse().slice(0,2).join('.')}`, color: '#6b6560' };
}

function render() { renderStats(); renderBoard(); }

function renderStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = Object.entries(COLS).map(([k,v]) =>
    `<div class="stat"><div class="sd" style="background:${v.color}"></div><span>${v.name}</span><strong>${cards.filter(c=>c.col===k).length}</strong></div>`
  ).join('') + `<div class="stat" style="border-color:rgba(201,168,76,0.25)"><span style="color:#c9a84c">Всього</span><strong style="color:#e8c97a">${cards.length}</strong></div>`;
}

function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  board.innerHTML = Object.entries(COLS).map(([col, cv]) => {
    const vis = visible(col);
    const isCollapsed = collapsed[col];
    const otherCols = Object.keys(COLS).filter(c => c !== col);
    return `
    <div class="col" style="border-top:3px solid ${cv.color}">
      <div class="col-head" onclick="toggleCol('${col}')">
        <div class="col-title">
          <div class="col-dot" style="background:${cv.color}"></div>
          <span class="col-name" style="color:${cv.color}">${cv.name}</span>
        </div>
        <div class="col-right">
          <span class="col-count">${vis.length}</span>
          <span class="col-toggle ${isCollapsed?'collapsed':''}">▾</span>
        </div>
      </div>
      <div class="col-body ${isCollapsed?'hidden':''}">
        ${vis.length === 0 ? '<div style="text-align:center;padding:16px;font-size:12px;color:#3a3530">Немає задач</div>' : ''}
        ${vis.map(card => {
          const a = ASSIGNEES[card.assignee] || ASSIGNEES.proj;
          const t = TAGS[card.tag] || TAGS.project;
          const due = dueInfo(card.due);
          const canEdit = currentUser === 'owner' || currentUser === card.assignee || currentUser === 'proj';
          const moveButtons = otherCols.map(c =>
            `<button class="cmove" onclick="moveCard('${card.fbId}','${c}',event)">→ ${COL_NAMES[c]}</button>`
          ).join('');
          return `
          <div class="card">
            <div class="card-top">
              <span class="ctag" style="background:${t.bg};color:${t.color}">${card.tag||'project'}</span>
              <div class="cpriority p-${card.priority||'normal'}"></div>
            </div>
            <div class="card-title">${card.title}</div>
            <div class="card-footer">
              <div class="card-assignee">
                <div class="cavatar" style="background:${a.color}18;border:1px solid ${a.color}30;color:${a.color};width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800">${a.short}</div>
                <span class="aname">${a.label}</span>
              </div>
              ${due ? `<span class="card-due" style="color:${due.color}">${due.label}</span>` : ''}
            </div>
            <div class="card-move">${moveButtons}</div>
            ${canEdit ? `
            <div class="card-actions">
              <button class="cact" onclick="editCard('${card.fbId}',event)">✏️ Редагувати</button>
              <button class="cact del" onclick="deleteCard('${card.fbId}',event)">🗑 Видалити</button>
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <button class="col-add-btn" onclick="openModal('${col}')">＋ Додати задачу</button>
    </div>`;
  }).join('');
}

// ── ACTIONS ──────────────────────────────────────────────
function toggleCol(col) { collapsed[col] = !collapsed[col]; renderBoard(); }

async function moveCard(fbId, newCol, e) {
  e.stopPropagation();
  const card = cards.find(c => c.fbId === fbId);
  if (!card) return;
  card.col = newCol;
  render();
  await updateCardInDB(fbId, { col: newCol });
  document.getElementById('syncLabel').textContent = 'Збережено ✓';
}

async function deleteCard(fbId, e) {
  e.stopPropagation();
  if (!confirm('Видалити задачу?')) return;
  cards = cards.filter(c => c.fbId !== fbId);
  render();
  await deleteCardFromDB(fbId);
  document.getElementById('syncLabel').textContent = 'Видалено ✓';
}

function editCard(fbId, e) {
  e.stopPropagation();
  const card = cards.find(c => c.fbId === fbId);
  if (!card) return;
  editId = fbId;
  document.getElementById('modalTitle').textContent = '✏️ Редагувати';
  document.getElementById('fTitle').value = card.title || '';
  document.getElementById('fCol').value = card.col || 'todo';
  document.getElementById('fAssignee').value = card.assignee || 'proj';
  document.getElementById('fTag').value = card.tag || 'project';
  document.getElementById('fPriority').value = card.priority || 'normal';
  document.getElementById('fDate').value = card.due || '';
  document.getElementById('fNote').value = card.note || '';
  document.getElementById('modalBg').classList.add('open');
}

function openModal(col = 'todo') {
  editId = null;
  document.getElementById('modalTitle').textContent = '＋ Нова задача';
  document.getElementById('fTitle').value = '';
  document.getElementById('fCol').value = col;
  document.getElementById('fAssignee').value = currentUser || 'proj';
  document.getElementById('fTag').value = 'project';
  document.getElementById('fPriority').value = 'normal';
  document.getElementById('fDate').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('modalBg').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 300);
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); editId = null; }

async function saveCard() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { document.getElementById('fTitle').style.borderColor='#e05252'; return; }
  const data = {
    title,
    col:      document.getElementById('fCol').value,
    assignee: document.getElementById('fAssignee').value,
    tag:      document.getElementById('fTag').value,
    priority: document.getElementById('fPriority').value,
    due:      document.getElementById('fDate').value,
    note:     document.getElementById('fNote').value.trim(),
  };
  closeModal();
  document.getElementById('syncLabel').textContent = 'Збереження...';
  if (editId) {
    const idx = cards.findIndex(c => c.fbId === editId);
    if (idx >= 0) cards[idx] = { ...cards[idx], ...data };
    render();
    await updateCardInDB(editId, data);
  } else {
    const fbId = await addCardToDB(data);
    if (fbId) {
      cards.push({ ...data, fbId });
      await sendEmailNotification(data);
    }
    render();
  }
  document.getElementById('syncLabel').textContent = 'Збережено ✓';
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
</script>
</body>
</html>
